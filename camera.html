<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>GestureControl</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }

    #video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* Canvas: no CSS sizing — sized via JS to match video exactly */
    #canvas {
      position: absolute; top: 0; left: 0;
      transform: scaleX(-1);
      z-index: 10;
      image-rendering: pixelated;
    }

    #status {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white;
      font-size: 11px; font-family: -apple-system, sans-serif;
      padding: 3px 12px; border-radius: 20px;
      white-space: nowrap; z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">Starting…</div>
  <script type="module" src="camera.js"></script>
</body>
</html>
